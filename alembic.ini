[alembic]
script_location = alembic
prepend_sys_path = .

# Override this via DATABASE_URL env var or --url CLI flag.
# Example PostgreSQL: postgresql+asyncpg://user:pass@localhost/recon_ai
sqlalchemy.url = postgresql+asyncpg://localhost/recon_ai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
