[project]
name = "recon-ai"
version = "0.1.0"
requires-python = ">=3.12"
description = "AI-assisted bug bounty reconnaissance platform. Authorized targets only."
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "sqlmodel>=0.0.19",
    "alembic>=1.13",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
]
sqlite = [
    "aiosqlite>=0.20",
]
ai = [
    "anthropic>=0.30",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
]

[project.scripts]
recon-ai = "cli.main:app"
recon-ai-mcp = "mcpserver.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "scope",
    "events",
    "recon",
    "modules",
    "controller",
    "database",
    "ai",
    "agent",
    "mcpserver",
    "ratelimit",
    "planner",
    "normalize",
    "cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
